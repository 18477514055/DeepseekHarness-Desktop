name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: 语法检查 + 内置服务器冒烟 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/status-page.js
          node --check src/updater.js
          node --check scripts/gen-third-party-licenses.js

      # 合规闸门：第三方许可清单必须与 node_modules 实际内容一致。
      # 过期的清单会让发布物不满足 MIT 的"保留版权与许可声明"义务。
      - name: License inventory is up to date
        run: npm run licenses:check

      # 合规闸门：三层署名必须都在 LICENSE 里。
      - name: LICENSE attribution intact
        shell: pwsh
        run: |
          $lic = Get-Content LICENSE -Raw
          $missing = @()
          foreach ($who in @('DeepSeek', 'chyra-moon', '18477514055')) {
            if ($lic -notmatch [regex]::Escape($who)) { $missing += $who }
          }
          if ($missing.Count -gt 0) {
            Write-Error "LICENSE 缺少署名: $($missing -join ', ')"
            exit 1
          }
          Write-Host "LICENSE 三层署名齐全 ✓"

      # 合规闸门：不得把上游迭代备份或交接文档提交进来。
      - name: No stray artifacts
        shell: pwsh
        run: |
          $stray = Get-ChildItem -Recurse -File -Force |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\\.git\\' } |
            Where-Object { $_.Name -match '\.bak|\.orig|\.rej' -or $_.Name -match '^00-合规交接' }
          if ($stray) {
            $stray | ForEach-Object { Write-Host "stray: $($_.FullName)" }
            Write-Error "发现不应提交的备份/交接文件"
            exit 1
          }
          Write-Host "无游离文件 ✓"

      # 自建内置服务器 -> 加载官方 UI -> 校验 __DSH_BOOT__ 注入
      # 退出码: 0 通过 / 1 校验失败 / 2 超时 / 9 单实例锁拒绝
      - name: Smoke test (builtin server)
        run: npm run smoke -- --port 0
        timeout-minutes: 8
